<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Month-Selector</title>
    <link rel="stylesheet" href="month.css">
</head>
<body>
    <div class="paragraph"><p>Select a month for buying the graphics card</p></div>
    <div class="boxes">
    <div class="box1 impossible"><button>January</button></div>
    <div class="box2 impossible"><button>February</button></div>
    <div class="box3 impossible"><button>March</button></div>
    <div class="box4 impossible"><button>April</button></div>
    <div class="box5 possible"><button>May</button></div>
    <div class="box6 possible"><button>June</button></div>
    <div class="box7 possible"><button>July</button></div>
    <div class="box8 early"><button>August</button></div>
    <div class="box9 early"><button>September</button></div>
    <div class="box10 early"><button>October</button></div>
    <div class="box11 early"><button>November</button></div>
    <div class="box12 early"><button>December</button></div>
    </div>
    <div class="possibilities">
    <div class="not-possible" id = "not_possible">
        <p>This Month is not possible, Please choose another month</p>
        <button class="accept billu">OK</button>
    </div>
    <div class="is-possible" id = "is_possible">
        <p>Thank you, You all are the best parents in the world!😊</p>
        <a href = "Mil-gya.html"><button class="accept" id = "sure_button">SURE</button></a>
    </div>
    <div class="too-early" id = "too_early">
        <p>Please choose earlier month</p>
        <button class="accept billu">OK</button>
    </div>
    </div>
    <script src="month_date.js"></script>
</body>
</html>
